[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvrp-capacitated-vehicle-routing"
version = "0.1.0"
description = "Capacitated vehicle routing example using PyVRP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyvrp==0.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
pyvrp-cvrp = "pyvrp_cvrp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --cov=pyvrp_cvrp --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
