[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "traveling-salesman-optimization-pyomo"
version = "0.1.0"
description = "Exact Traveling Salesman Problem optimization with Pyomo, MTZ constraints, and HiGHS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyomo>=6.9,<7",
  "highspy>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
